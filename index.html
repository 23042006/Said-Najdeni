    /* ── ORARI SELECTOR MODAL ── */
    #orari-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(6px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    #orari-modal-overlay.open { display: flex; }
    #orari-selector {
      background: #141720;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 36px 36px;
      width: min(460px, 92vw);
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
      animation: modalIn 0.28s ease both;
      text-align: center;
      position: relative;
    }
    @keyframes modalIn {
      from { opacity:0; transform: scale(0.93) translateY(12px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }
    .orari-sel-close {
      position: absolute; top: 14px; right: 16px;
      background: none; border: none;
      color: #9b98aa; font-size: 20px; cursor: pointer;
      line-height: 1; padding: 4px 8px; border-radius: 8px;
      transition: color 0.2s;
    }
    .orari-sel-close:hover { color: #fff; }
    .orari-sel-icon { font-size: 36px; margin-bottom: 12px; }
    .orari-sel-title {
      font-size: 22px; font-weight: 700;
      color: #eceaf4; margin-bottom: 6px;
    }
    .orari-sel-sub {
      font-size: 13px; color: #9b98aa; margin-bottom: 28px;
    }
    .orari-sel-btns { display: flex; flex-direction: column; gap: 14px; }
    .orari-sel-btn {
      display: flex; align-items: center; gap: 16px;
      background: #1c1f2d;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px;
      padding: 18px 20px;
      cursor: pointer;
      text-decoration: none;
      color: #eceaf4;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      text-align: left;
    }
    .orari-sel-btn:hover {
      border-color: rgba(240,180,41,0.5);
      background: #252838;
      transform: translateY(-2px);
    }
    .orari-sel-btn-icon {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;

    .orari-sel-btn-icon.kp  { background: rgba(240,180,41,0.13); border: 1px solid rgba(240,180,41,0.3); }

    .orari-sel-btn-desc  { font-size: 12px; color: #9b98aa; }
    .orari-sel-btn-arrow { margin-left: auto; font-size: 18px; color: #5a5870; flex-shrink:0; }
    .orari-sel-btn:hover .orari-sel-btn-arrow { color: #f0b429; }

      'orari.html',
      'mesuesit.html',

      'kontakti.html',
      'footer.html',
    ];

    async function loadSections() {
      const app = document.getElementById('app');
      for (const src of sections) {
        try {
          const res  = await fetch(src);
          const html = await res.text();
          const div  = document.createElement('div');
          div.innerHTML = html;
          app.appendChild(div);
        } catch (e) {
          console.warn('Seksioni nuk u gjet:', src);
        }
      }
      initScripts();
    }

    function initScripts() {
      // ── Navbar scroll shadow ──
      window.addEventListener('scroll', () => {
        const nav = document.getElementById('navbar');
        if (nav) nav.classList.toggle('scrolled', window.scrollY > 40);
      });

      // ── Gjej linkun "Orari" në navbar dhe lidhe me modal ──
      document.querySelectorAll('a[href="#orari"], a[href*="orari"]').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          openOrariModal();
        });
      });

      // ── Animacionet ──
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.opacity = '1';
            entry.target.style.transform = 'translateY(0)';
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.lajm-card, .drejtim-card, .mesues-card, .gal-item, .value-item').forEach(el => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(24px)';
        el.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        observer.observe(el);
      });
    }

    // ── Funksionet globale ekzistuese ──
    function toggleMenu() {
      const menu = document.getElementById('mobileMenu');
      if (menu) menu.classList.toggle('open');
    }

    function handleSubmit(e) {
      e.preventDefault();
      const msg = document.getElementById('form-msg');
      if (msg) {
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 4000);
      }
    }

    function switchTab(id) {
      document.querySelectorAll('.orari-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.orari-panel').forEach(p => p.classList.remove('active'));
      const panel = document.getElementById('tab-' + id);
      if (panel) panel.classList.add('active');
      document.querySelectorAll('.orari-tab').forEach(t => {
        if (t.getAttribute('onclick') === `switchTab('${id}')`) {
          t.classList.add('active');
        }
      });
    }

    // Escape key mbyll modal-in
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeOrariModalBtn();
    });


    function openOrariModal() {
      document.getElementById('orari-modal-overlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeOrariModalBtn() {
      document.getElementById('orari-modal-overlay').classList.remove('open');
      document.body.style.overflow = '';
    }
    function closeOrariModal(e) {
      if (e.target === document.getElementById('orari-modal-overlay')) closeOrariModalBtn();
    }
